apiVersion: v1
kind: ConfigMap
metadata:
  name: p14-web-html
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head><meta charset="UTF-8"><title>Project 14 - EKS</title></head>
    <body style="font-family:Arial,sans-serif;text-align:center;margin-top:100px">
      <h1>Hello from Amazon EKS!</h1>
      <p>This page is served by nginx pods running on Kubernetes.</p>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: p14-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: p14-web
  template:
    metadata:
      labels:
        app: p14-web
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
      volumes:
        - name: html
          configMap:
            name: p14-web-html
---
apiVersion: v1
kind: Service
metadata:
  name: p14-web
spec:
  type: LoadBalancer
  selector:
    app: p14-web
  ports:
    - port: 80
      targetPort: 80
